<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13213A" />
    <title>Прогнози</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap top-row">
        <div>
          <h1>Прогнози</h1>
          <p id="status" class="status">Зареждам…</p>
        </div>
        <button id="refresh" class="refresh" aria-label="Обнови">↻</button>
      </div>
      <div class="wrap">
        <div id="days" class="days" role="tablist" aria-label="Ден"></div>
      </div>
    </header>

    <main class="wrap">
      <div class="tools">
        <input id="search" type="search" placeholder="Търси отбор или лига" aria-label="Търси отбор или лига" />
        <label class="only">
          <input id="onlyTips" type="checkbox" checked />
          Само с прогноза
        </label>
      </div>

      <div id="list"></div>

      <p class="foot">
        Прогнозите са от
        <a href="https://www.futbol24.com/betting-tips/" target="_blank" rel="noopener">futbol24.com</a>
        и се обновяват автоматично. Часовете са по вашето време. Само за пълнолетни, залагайте отговорно.
      </p>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/tip-text.js"></script>
    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
